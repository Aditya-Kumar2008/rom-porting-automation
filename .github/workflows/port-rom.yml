name: Port ColorOS to HyperOS

on:
  workflow_dispatch:
    inputs:
      hyperos_url:
        description: 'HyperOS ROM OTA URL'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WFSINXM/ruan_in_global-ota_full-OS3.0.305.0.WFSINXM-user-16.0-1ede5cec45.zip'
      coloros_url:
        description: 'ColorOS/OOS Donor ROM OTA URL (fresh link, expires ~30min)'
        required: true
        default: 'https://gauss-compota-c-fr.allawnofs.com/remove-e3fe1ae8ce09716b9b69a4d5de2a3f93/g-10eab6008d5642cf42abd2aa41f847cb/component-ota/26/07/20/3924d761f9cd42b19b55cb0bf8400819.zip?sign=aaff1e9b9eb51fbf3bbccaa50e4bb646&t=6a9ec4a9&x-oss-signature=EPR3nFc0il0d%2BPGVNkyD9B5VdEbqJlh9i%2BclWmAPpZE%3D&x-oss-signature-version=OSS2&x-oss-expires=1788791729&x-oss-access-key-id=LTAI5t7LQqPWs3796pRv6Avx'

env:
  WORK_DIR: /tmp/rom-porting
  DEVICE_CODENAME: ruan
  DEVICE_NAME: "Poco Pad 5G"
  CPU_MODEL: SM7435
  FRONT_CAM: "8"
  BACK_CAM: "8"
  SCREEN_SIZE: "12.1"
  DONOR_BRAND: OnePlus
  DONOR_MODEL: "12R 5G"

jobs:
  port-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/graalvm /usr/local/share/powershell /usr/local/share/chromium /usr/local/julia* /usr/local/share/miniconda /usr/local/ghc
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils wget unzip zip jq curl aria2
          cd /tmp
          wget -q "https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz" -O pd.tar.gz
          tar xzf pd.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/
          rm pd.tar.gz

      - name: Create dirs
        run: mkdir -p ${WORK_DIR}/{hyperos,coloros,output}

      # ============================================================
      # PHASE 1: Download & extract HyperOS
      # ============================================================
      - name: Download HyperOS ROM
        run: aria2c -x16 -s16 -j5 --file-allocation=none -d ${WORK_DIR}/hyperos -o hyperos-rom.zip "${{ github.event.inputs.hyperos_url }}"

      - name: Dump HyperOS partitions
        run: |
          cd ${WORK_DIR}/hyperos
          unzip -o hyperos-rom.zip payload.bin -d .
          rm -f hyperos-rom.zip
          mkdir -p images
          payload-dumper-go -o images payload.bin 2>&1 | tail -5
          rm -f payload.bin
          ls -lh images/

      - name: Extract HyperOS EROFS
        run: |
          cd ${WORK_DIR}/hyperos
          for img in vendor odm; do
            if [ -f "images/${img}.img" ]; then
              mkdir -p "extracted/${img}"
              fsck.erofs --extract="extracted/${img}" "images/${img}.img" 2>&1 | tail -2
              rm -f "images/${img}.img"
            fi
          done

      # ============================================================
      # PHASE 2: Download & extract ColorOS
      # ============================================================
      - name: Download ColorOS ROM
        run: aria2c -x16 -s16 -j5 --file-allocation=none -d ${WORK_DIR}/coloros -o coloros-rom.zip "${{ github.event.inputs.coloros_url }}"

      - name: Dump ColorOS partitions
        run: |
          cd ${WORK_DIR}/coloros
          unzip -o coloros-rom.zip payload.bin -d .
          rm -f coloros-rom.zip
          mkdir -p images
          payload-dumper-go -o images payload.bin 2>&1 | tail -5
          rm -f payload.bin
          ls -lh images/

      - name: Extract ALL ColorOS partitions
        run: |
          cd ${WORK_DIR}/coloros
          for img in vendor odm system system_ext product my_product my_manifest my_region my_heytap my_bigball my_carrier my_engineering my_stock; do
            if [ -f "images/${img}.img" ]; then
              echo "Extracting ${img}..."
              mkdir -p "extracted/${img}"
              fsck.erofs --extract="extracted/${img}" "images/${img}.img" 2>&1 | tail -2
              rm -f "images/${img}.img"
            fi
          done
          ls -d extracted/*/ 2>/dev/null
          df -h / | tail -1

      # ============================================================
      # PHASE 3: COS&OOS Vendor Port
      # ============================================================
      - name: "COS&OOS: Vendor port"
        run: |
          HV="${WORK_DIR}/hyperos/extracted/vendor"
          CV="${WORK_DIR}/coloros/extracted/vendor"
          ODM=""
          if [ -f "${WORK_DIR}/hyperos/extracted/odm/etc/build.prop" ]; then
            ODM="${WORK_DIR}/hyperos/extracted/odm/etc/build.prop"
          elif [ -f "${HV}/odm/etc/build.prop" ]; then
            ODM="${HV}/odm/etc/build.prop"
          else
            mkdir -p "${HV}/odm/etc"
            ODM="${HV}/odm/etc/build.prop"
            touch "${ODM}"
          fi
          cp -v "${CV}/etc/group" "${HV}/etc/group"
          cp -v "${CV}/etc/passwd" "${HV}/etc/passwd"
          cp "${ODM}" "${ODM}.bak"
          printf '\n# === ColorOS Port ===\nro.build.device_family=OP%s\nro.product.oplus.cpuinfo=%s\nro.product.brand=%s\nro.product.manufacturer=%s\nro.product.model=%s\nro.vendor.oplus.market.name=%s\nro.vendor.oplus.camera.frontCamSize=%s\nro.vendor.oplus.camera.backCamSize=%s\nro.oplus.display.screenSizeInches.primary=%s\nro.build.version.oplusrom=V15.0\nro.vendor.audio.policy.engine.odm=true\n' \
            "${CPU_MODEL}" "${CPU_MODEL}" "${DONOR_BRAND}" "${DONOR_BRAND}" "${DEVICE_CODENAME}" "${DEVICE_NAME}" "${FRONT_CAM}" "${BACK_CAM}" "${SCREEN_SIZE}" >> "${ODM}"
          grep -E "device_family|cpuinfo|brand|model|market|camera|display|oplusrom" "${ODM}"

      # ============================================================
      # PHASE 4: bbk_rom_porting Guide Steps 7-15
      # ============================================================
      - name: "bbk Step 7: Clean system my_*"
        run: |
          S="${WORK_DIR}/coloros/extracted/system"
          for d in my_product my_manifest my_region my_heytap my_bigball my_carrier my_engineering my_stock; do
            [ -d "${S}/${d}" ] && rm -rf "${S}/${d}" && echo "Deleted ${d}"
          done

      - name: "bbk Step 8: Add my_* to system"
        run: |
          S="${WORK_DIR}/coloros/extracted/system"
          for d in my_product my_manifest my_region my_heytap my_bigball my_carrier my_engineering my_stock; do
            if [ -d "${WORK_DIR}/coloros/extracted/${d}" ]; then
              cp -a "${WORK_DIR}/coloros/extracted/${d}" "${S}/"
              echo "Added ${d}"
            fi
          done

      - name: "bbk Step 9: Modify my_manifest"
        run: |
          M="${WORK_DIR}/coloros/extracted/system/my_manifest/etc/build.prop"
          if [ -f "${M}" ]; then
            sed -i '/first.api/d' "${M}"
            if grep -q "market.name" "${M}"; then
              sed -i "s|.*market.name.*|ro.vendor.oplus.market.name=${DEVICE_NAME}|" "${M}"
            else
              echo "ro.vendor.oplus.market.name=${DEVICE_NAME}" >> "${M}"
            fi
            echo "my_manifest updated"
            cat "${M}"
          fi

      - name: "bbk Step 10: Add apex"
        run: |
          SE="${WORK_DIR}/coloros/extracted/system_ext"
          mkdir -p "${SE}/apex"
          if [ -f "${{ github.workspace }}/system_ext.zip" ]; then
            cd /tmp && unzip -o "${{ github.workspace }}/system_ext.zip" -d apex-tmp
            find /tmp/apex-tmp -name "*.apex" -exec cp -v {} "${SE}/apex/" \;
            ls -lh "${SE}/apex/"
            rm -rf /tmp/apex-tmp
          fi

      - name: "bbk Step 11: Add overlays"
        run: |
          MP="${WORK_DIR}/coloros/extracted/system/my_product"
          mkdir -p "${MP}/overlay"
          if [ -f "${{ github.workspace }}/overlay.zip" ]; then
            cd /tmp && unzip -o "${{ github.workspace }}/overlay.zip" -d overlay-tmp
            find /tmp/overlay-tmp -name "*.apk" -exec cp -v {} "${MP}/overlay/" \;
            ls -lh "${MP}/overlay/"
            rm -rf /tmp/overlay-tmp
          fi

      - name: "bbk Steps 12-15: Modify my_product"
        run: |
          PP="${WORK_DIR}/coloros/extracted/system/my_product/etc/build.prop"
          if [ -f "${PP}" ]; then
            grep -q "oplusrom.display" "${PP}" && sed -i "s|.*oplusrom.display.*|ro.oplusrom.display=15.0 | by ${DEVICE_NAME}|" "${PP}"
            sed -i '/screenhole/d' "${PP}"
            grep -q "lcd.density" "${PP}" && sed -i "s|lcd.density=.*|lcd.density=440|" "${PP}"
            for L in "ro.density.screenzoom.fdh" "ro.density.screenzoom.qdh" "ro.oplus.density.fhd_default" "ro.oplus.density.qhd_default" "ro.oplus.resolution.low" "ro.oplus.resolution.high"; do
              sed -i "/${L}/d" "${PP}"
            done
            echo "my_product updated"
            cat "${PP}"
          fi

      - name: "bbk Step 14: Add imports"
        run: |
          SP="${WORK_DIR}/coloros/extracted/system/build.prop"
          if [ -f "${SP}" ]; then
            printf '\nimport /my_bigball/build.prop\nimport /my_carrier/build.prop\nimport /my_engineering/build.prop\nimport /my_heytap/build.prop\nimport /my_manifest/build.prop\nimport /my_product/build.prop\nimport /my_region/build.prop\nimport /my_stock/build.prop\n' >> "${SP}"
            echo "Imports added"
          fi

      - name: "bbk Legacy: Merge partitions"
        run: |
          S="${WORK_DIR}/coloros/extracted/system"
          [ -d "${WORK_DIR}/coloros/extracted/system_ext" ] && cp -rn "${WORK_DIR}/coloros/extracted/system_ext/"* "${S}/" 2>/dev/null && echo "system_ext merged"
          [ -d "${WORK_DIR}/coloros/extracted/product" ] && cp -rn "${WORK_DIR}/coloros/extracted/product/"* "${S}/" 2>/dev/null && echo "product merged"
          echo "Final system: $(du -sh ${S})"

      # ============================================================
      # PHASE 5: Repack ALL partitions
      # ============================================================
      - name: Repack system.img
        run: |
          mkfs.erofs -zlz4hc,12 -b 4096 ${WORK_DIR}/output/system.img "${WORK_DIR}/coloros/extracted/system"
          ls -lh ${WORK_DIR}/output/system.img
          rm -rf "${WORK_DIR}/coloros/extracted/system"

      - name: Repack vendor.img
        run: |
          mkfs.erofs -zlz4hc,12 -b 4096 ${WORK_DIR}/output/vendor.img "${WORK_DIR}/hyperos/extracted/vendor"
          ls -lh ${WORK_DIR}/output/vendor.img
          rm -rf "${WORK_DIR}/hyperos/extracted/vendor"

      - name: Repack odm.img
        run: |
          [ -d "${WORK_DIR}/hyperos/extracted/odm" ] && mkfs.erofs -zlz4hc,12 -b 4096 ${WORK_DIR}/output/odm.img "${WORK_DIR}/hyperos/extracted/odm" && ls -lh ${WORK_DIR}/output/odm.img

      - name: Copy HyperOS boot images
        run: |
          for img in boot.img vendor_boot.img vendor_dlkm.img modem.img; do
            [ -f "${WORK_DIR}/hyperos/images/${img}" ] && cp -v "${WORK_DIR}/hyperos/images/${img}" ${WORK_DIR}/output/
          done
          echo "=== ALL OUTPUT ==="
          ls -lh ${WORK_DIR}/output/

      # ============================================================
      # PHASE 6: Build full ROM flashable ZIP
      # ============================================================
      - name: Build recovery flashable ZIP
        run: |
          FD="${WORK_DIR}/recovery-flashable"
          mkdir -p ${FD}/META-INF/com/google/android

          # updater-binary for TWRP/OrangeFox
          printf '#!/sbin/sh\nui_print() { echo "ui_print $1" > /proc/self/fd/$OUTFD; echo "ui_print" > /proc/self/fd/$OUTFD; }\nset_progress() { echo "set_progress $1" > /proc/self/fd/$OUTFD; }\nui_print "============================================"\nui_print "  ColorOS ROM Port for Poco Pad 5G"\nui_print "  Based on HyperOS + OnePlus 12R"\nui_print "============================================"\nui_print ""\nmount /system 2>/dev/null\nmount /vendor 2>/dev/null\nmount /odm 2>/dev/null\nui_print "Flashing partitions..."\nfor PART in system vendor odm; do\n  if [ -f /tmp/${PART}.img ]; then\n    ui_print "Flashing ${PART}..."\n    dd if=/tmp/${PART}.img of=/dev/block/by-name/${PART} bs=4096\n    sync\n  fi\ndone\nui_print "Done! Rebooting..."\nset_progress 1.0\nexit 0\n' > "${FD}/META-INF/com/google/android/update-binary"

          printf 'show_progress(0.1, 5.0);\npackage_extract_file("system.img", "/tmp/system.img");\npackage_extract_file("vendor.img", "/tmp/vendor.img");\npackage_extract_file("odm.img", "/tmp/odm.img");\nrun_program("/sbin/sh", "/tmp/update-binary");\nshow_progress(1.0, 0);\n' > "${FD}/META-INF/com/google/android/updater-script"

          cp ${WORK_DIR}/output/system.img ${FD}/
          cp ${WORK_DIR}/output/vendor.img ${FD}/
          cp ${WORK_DIR}/output/odm.img ${FD}/ 2>/dev/null || true

          cd ${FD}
          RECOVERY_ZIP="ColorOS_Recovery_${DEVICE_CODENAME}_$(date +%Y%m%d).zip"
          zip -r9 ${WORK_DIR}/output/${RECOVERY_ZIP} .
          echo "RECOVERY_ZIP=${RECOVERY_ZIP}" >> $GITHUB_ENV
          echo "Recovery ZIP built: ${RECOVERY_ZIP}"
          ls -lh ${WORK_DIR}/output/${RECOVERY_ZIP}

      - name: Build fastboot flashable package
        run: |
          FD="${WORK_DIR}/fastboot-flashable"
          mkdir -p ${FD}/images

          # Copy all images
          for img in ${WORK_DIR}/output/*.img; do
            [ -f "$img" ] && cp -v "$img" ${FD}/images/
          done

          # Create flash script
          printf '#!/bin/bash\n# Fastboot flash script for Poco Pad 5G (ruan)\n# ColorOS ROM Port based on HyperOS + OnePlus 12R\n\nset -e\necho "============================================"\necho "  ColorOS ROM Fastboot Flasher"\necho "  Device: Poco Pad 5G (ruan)"\necho "============================================"\necho ""\necho "Make sure device is in fastboot mode:"\necho "  adb reboot bootloader"\necho ""\nread -p "Press Enter to continue..."\n\nIMAGES_DIR="$(dirname "$0")/images"\n\n# Flash partitions\nfor PART in system vendor odm boot vendor_boot; do\n  IMG="${IMAGES_DIR}/${PART}.img"\n  if [ -f "$IMG" ]; then\n    echo "Flashing ${PART}..."\n    fastboot flash ${PART} "$IMG"\n  fi\ndone\n\n# Flash modem if present\nif [ -f "${IMAGES_DIR}/modem.img" ]; then\n  echo "Flashing modem..."\n  fastboot flash modem "${IMAGES_DIR}/modem.img"\nfi\n\necho ""\necho "============================================"\necho "  Flash complete! Rebooting..."\necho "============================================"\nfastboot reboot\n' > "${FD}/flash_all.sh"
          chmod +x "${FD}/flash_all.sh"

          # Create Windows batch file
          printf '@echo off\necho ============================================\necho   ColorOS ROM Fastboot Flasher\necho   Device: Poco Pad 5G (ruan)\necho ============================================\necho.\necho Make sure device is in fastboot mode:\necho   adb reboot bootloader\necho.\npause\n\nfor %%%%f in (images\\*.img) do (\n  echo Flashing %%%%~nf...\n  fastboot flash %%%%~nf "images\\%%%%f"\n)\n\necho.\necho ============================================\necho   Flash complete! Rebooting...\necho ============================================\nfastboot reboot\npause\n' > "${FD}/flash_all.bat"

          cd ${FD}
          FASTBOOT_ZIP="ColorOS_Fastboot_${DEVICE_CODENAME}_$(date +%Y%m%d).zip"
          zip -r9 ${WORK_DIR}/output/${FASTBOOT_ZIP} .
          echo "FASTBOOT_ZIP=${FASTBOOT_ZIP}" >> $GITHUB_ENV
          echo "Fastboot ZIP built: ${FASTBOOT_ZIP}"
          ls -lh ${WORK_DIR}/output/${FASTBOOT_ZIP}

          echo ""
          echo "=== ALL OUTPUT ==="
          ls -lh ${WORK_DIR}/output/

      # ============================================================
      # PHASE 7: Upload to Gofile
      # ============================================================
      - name: Upload to Catbox.moe
        id: catbox_upload
        run: |
          # Catbox.moe: 25GB limit, no account needed
          upload_catbox() {
            local file="$1"
            local bn=$(basename "$file")
            echo "Uploading ${bn} ($(du -h "$file" | cut -f1))..."
            RESP=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@${file}" "https://catbox.moe/user/api.php" 2>&1)
            if echo "$RESP" | grep -q "https://files.catbox.moe"; then
              echo "${bn}: ${RESP}"
              echo "${bn%.img}_url=${RESP}" >> $GITHUB_OUTPUT
            else
              echo "${bn}: FAILED (${RESP})"
            fi
          }

          # Upload full ROM ZIP
          ZF="${WORK_DIR}/output/${FLASHABLE_ZIP}"
          if [ -f "${ZF}" ]; then
            upload_catbox "$ZF"
          fi

          # Upload individual images
          for img in ${WORK_DIR}/output/*.img; do
            [ -f "$img" ] || continue
            upload_catbox "$img"
          done

      - name: Final Summary
        run: |
          echo "============================================"
          echo "  FULL ROM PORTING COMPLETE!"
          echo "============================================"
          echo "  Device: ${DEVICE_NAME} (${DEVICE_CODENAME})"
          echo "  Donor: ${DONOR_BRAND} ${DONOR_MODEL}"
          echo ""
          echo "  Full ROM ZIP: check Catbox links above"
          echo ""
          echo "  Individual images uploaded to Gofile"
          echo ""
          echo "  WARNING: FLASH AT YOUR OWN RISK!"
          echo "============================================"
