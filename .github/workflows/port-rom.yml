name: Port ColorOS to HyperOS

on:
  workflow_dispatch:
    inputs:
      hyperos_url:
        description: 'HyperOS ROM OTA URL'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WFSINXM/ruan_in_global-ota_full-OS3.0.305.0.WFSINXM-user-16.0-1ede5cec45.zip'
      coloros_url:
        description: 'ColorOS/OOS Donor ROM OTA URL (auto-resolves if downloadCheck URL)'
        required: true
        default: 'https://component-ota-eu.allawnos.com/downloadCheck?c=e3fe1ae8ce09716b9b69a4d5de2a3f93&p=c25c9713dab2a25c829e30fe386cbe4301a2df46a5de73707d36d2ac04916f87146caff83788d73262a4181c2077&d=851ad54c99bfa241d5d076b47975b91b5ae3d60ba797246f7975c5af5dc86d924a61afb32ddb8867&g=10eab6008d5642cf42abd2aa41f847cb&id=6a5e08859e207b01827c83c3&taste=1&supportDLTaste=0&mode=1&tr=manual&s=71a3703f61ae483f6284edf5bcfbba04'

env:
  WORK_DIR: /tmp/rom-porting
  DEVICE_CODENAME: ruan
  DEVICE_NAME: "Poco Pad 5G"
  CPU_MODEL: SM7435
  FRONT_CAM: "8"
  BACK_CAM: "8"
  SCREEN_SIZE: "12.1"
  DONOR_BRAND: OnePlus
  DONOR_MODEL: "12R 5G"
  SUPER_SIZE: "9126805504"
  DYNAMIC_SIZE: "9126805504"

permissions:
  contents: write

jobs:
  port-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/graalvm /usr/local/share/powershell /usr/local/share/chromium /usr/local/julia* /usr/local/share/miniconda /usr/local/ghc
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq erofs-utils wget unzip zip jq curl aria2 python3-pip android-sdk-libsparse-utils
          cd /tmp
          wget -q "https://raw.githubusercontent.com/Rprop/aosp15_partition_tools/main/linux_glibc_x86_64/lpmake" -O lpmake || true
          chmod +x lpmake 2>/dev/null && sudo mv lpmake /usr/local/bin/ || echo "::warning::lpmake download failed"
          wget -q "https://raw.githubusercontent.com/Rprop/aosp15_partition_tools/main/linux_glibc_x86_64/lpunpack" -O lpunpack || true
          chmod +x lpunpack 2>/dev/null && sudo mv lpunpack /usr/local/bin/ || true
          wget -q "https://raw.githubusercontent.com/Rprop/aosp15_partition_tools/main/linux_glibc_x86_64/lpdumps" -O lpdumps || true
          chmod +x lpdumps 2>/dev/null && sudo mv lpdumps /usr/local/bin/lpdump || true
          wget -q "https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz" -O pd.tar.gz
          tar xzf pd.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/
          rm pd.tar.gz
          echo "=== Installed tools ==="
          which lpmake img2simg payload-dumper-go mkfs.erofs 2>&1 || true

      - name: 🔐 Validate ROM URLs
        shell: python
        env:
          HYPEROS_URL: ${{ github.event.inputs.hyperos_url }}
          COLOROS_URL: ${{ github.event.inputs.coloros_url }}
        run: |
          import os, sys, re, json
          from urllib.parse import urlparse

          errors = 0
          for name in ("HYPEROS_URL", "COLOROS_URL"):
              url = os.environ[name].strip()
              parsed = urlparse(url)
              if parsed.scheme != "https":
                  print(f"::error::{name} must use HTTPS, got: {parsed.scheme}")
                  errors += 1
              elif not parsed.netloc:
                  print(f"::error::{name} has no host")
                  errors += 1
              else:
                  print(f"✅ {name}: valid HTTPS URL")
          
          # Check for expired URLs (OSS signed URLs) - warn only, don't fail
          coloros_url = os.environ["COLOROS_URL"].strip()
          expires_match = re.search(r'x-oss-expires=(\d+)', coloros_url)
          if expires_match:
              import time
              expires_at = int(expires_match.group(1))
              now = int(time.time())
              if now > expires_at:
                  print(f"⚠️ ColorOS URL has EXPIRED ({(now - expires_at) // 60} min ago) - will auto-resolve")
              else:
                  remaining = (expires_at - now) // 60
                  print(f"✅ ColorOS URL valid, expires in {remaining} minutes")
          
          # Check if URL is a downloadCheck URL
          if 'downloadCheck' in coloros_url:
              print("✅ URL is a downloadCheck URL - will auto-resolve before download")
          
          print("✅ All URLs validated")

      - name: 🔐 Validate publishing secrets
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set -Eeuo pipefail
          errors=0
          # SourceForge is required
          for var in SF_USERNAME SF_PASSWORD SF_PROJECT; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: ${var}"
              errors=$((errors+1))
            else
              echo "✅ ${var} is set"
            fi
          done
          # Optional upload services
          for var in GDRIVE_SA_KEY GDRIVE_FOLDER_ID GOFILE_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "⚠️ Optional secret not set: ${var}"
            else
              echo "✅ ${var} is set"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::${errors} required secrets are missing"
            exit 1
          fi
          echo "✅ Publishing secrets validated (SourceForge required, others optional)"

      - name: 💾 Verify build storage
        run: |
          set -Eeuo pipefail
          available_kb="$(df -Pk /tmp | awk 'NR == 2 {print $4}')"
          required_kb=$((30 * 1024 * 1024))
          df -h /tmp
          if (( available_kb < required_kb )); then
            echo "::error::Insufficient build storage: need at least 30 GiB free; available $((available_kb / 1024 / 1024)) GiB"
            exit 1
          fi
          echo "✅ Build storage OK: $((available_kb / 1024 / 1024)) GiB available"

      - name: Create dirs
        run: mkdir -p ${WORK_DIR}/{hyperos,coloros,output}

      - name: Download HyperOS ROM
        run: aria2c -x16 -s16 -j5 --file-allocation=none -d ${WORK_DIR}/hyperos -o hyperos-rom.zip "${{ github.event.inputs.hyperos_url }}"

      - name: Dump HyperOS partitions
        run: |
          cd ${WORK_DIR}/hyperos
          unzip -o hyperos-rom.zip payload.bin -d .
          rm -f hyperos-rom.zip
          mkdir -p images
          payload-dumper-go -o images payload.bin 2>&1 | tail -5
          rm -f payload.bin
          ls -lh images/

      - name: Extract HyperOS EROFS
        run: |
          cd ${WORK_DIR}/hyperos
          for img in vendor odm; do
            if [ -f "images/${img}.img" ]; then
              mkdir -p "extracted/${img}"
              fsck.erofs --extract="extracted/${img}" "images/${img}.img" 2>&1 | tail -2
              rm -f "images/${img}.img"
            fi
          done

      - name: Download ColorOS ROM
        run: |
          set -Eeuo pipefail
          COLOROS_URL="${{ github.event.inputs.coloros_url }}"
          
          # If URL is a downloadCheck URL or expired, resolve it using Playwright
          NEED_RESOLVE=false
          if echo "$COLOROS_URL" | grep -q "downloadCheck"; then
            NEED_RESOLVE=true
            echo "⚠️ URL is downloadCheck - will resolve via Playwright"
          else
            # Check if URL is expired
            EXPIRES=$(echo "$COLOROS_URL" | grep -oP 'x-oss-expires=\K\d+' || echo "")
            if [ -n "$EXPIRES" ]; then
              NOW=$(date +%s)
              if [ "$NOW" -gt "$EXPIRES" ]; then
                NEED_RESOLVE=true
                echo "⚠️ URL has EXPIRED - will resolve via Playwright"
              fi
            fi
          fi
          
          if [ "$NEED_RESOLVE" = "true" ]; then
            echo "Resolving ColorOS URL via roms.danielspringer.at..."
            python3 << 'RESOLVE_EOF'
          import requests, json, re, sys
          
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'})
          
          # Step 1: Submit form to get build info with CSRF token
          resp = session.post(
              'https://roms.danielspringer.at/index.php?view=ota',
              data={
                  'device': 'OP 12R',
                  'region': 'IN',
                  'version': 'CPH2585_16.0.5.1002(EX01)',
              },
              headers={
                  'Referer': 'https://roms.danielspringer.at/index.php?view=ota',
                  'Origin': 'https://roms.danielspringer.at',
              }
          )
          
          # Step 2: Parse resultBox for ota-key and csrf
          match = re.search(r'data-ota-key="([^"]+)"[^>]*data-csrf="([^"]+)"', resp.text)
          if not match:
              print("ERROR: Could not find resultBox with ota-key/csrf")
              sys.exit(1)
          
          ota_key = match.group(1)
          csrf = match.group(2)
          print(f"Got ota-key: {ota_key[:8]}...")
          
          # Step 3: Call resolver API
          resp2 = session.post(
              'https://roms.danielspringer.at/index.php?view=ota&ota_action=resolve_json',
              data={'k': ota_key, 'csrf': csrf},
              headers={
                  'Referer': 'https://roms.danielspringer.at/index.php?view=ota',
                  'Origin': 'https://roms.danielspringer.at',
              }
          )
          
          data = resp2.json()
          if data.get('ok') and data.get('url'):
              url = data['url']
              print(f"RESOLVED_URL={url}")
              with open("/tmp/resolved_coloros_url.txt", "w") as f:
                  f.write(url)
              print("✅ URL resolved successfully")
          else:
              print(f"ERROR: Resolver failed: {data}")
              sys.exit(1)
          RESOLVE_EOF
            
            if [ -f /tmp/resolved_coloros_url.txt ]; then
              COLOROS_URL=$(cat /tmp/resolved_coloros_url.txt)
              echo "✅ Using resolved URL"
            else
              echo "::error::Failed to resolve ColorOS URL"
              exit 1
            fi
          fi
          
          echo "Downloading ColorOS ROM..."
          aria2c -x16 -s16 -j5 --file-allocation=none -d ${WORK_DIR}/coloros -o coloros-rom.zip "$COLOROS_URL"

      - name: Dump ColorOS partitions
        run: |
          cd ${WORK_DIR}/coloros
          unzip -o coloros-rom.zip payload.bin -d .
          rm -f coloros-rom.zip
          mkdir -p images
          payload-dumper-go -o images payload.bin 2>&1 | tail -5
          rm -f payload.bin
          ls -lh images/

      - name: Extract ALL ColorOS partitions
        run: |
          cd ${WORK_DIR}/coloros
          for img in vendor odm system system_ext product my_product my_manifest my_region my_heytap my_bigball my_carrier my_engineering my_stock; do
            if [ -f "images/${img}.img" ]; then
              echo "Extracting ${img}..."
              mkdir -p "extracted/${img}"
              fsck.erofs --extract="extracted/${img}" "images/${img}.img" 2>&1 | tail -2
              rm -f "images/${img}.img"
            fi
          done
          ls -d extracted/*/ 2>/dev/null
          df -h / | tail -1

      - name: "🔧 Build Custom ODM Bridge Layer"
        run: |
          # The ODM is the critical bridge between ColorOS system and HyperOS vendor.
          # Old dev (pipa→dizi) had Xiaomi→Xiaomi HALs. We (OnePlus 12R→ruan) need
          # OnePlus→Xiaomi HALs. We use old dev's ODM as TEMPLATE for structure
          # (resetprop, disable_ims.rc, oplus HAL stubs) but REPLACE all device
          # identity props for our OnePlus 12R → Poco Pad 5G port.
          
          echo "=== Phase 1: Download ODM template from old dev's port ==="
          cd ${WORK_DIR}
          aria2c -x16 -s16 https://pixeldrain.com/api/file/cR8mvzkx -o old_port.zip || {
            echo "::warning::Could not download ODM template. Will build minimal ODM."
          }
          
          if [ -f old_port.zip ]; then
            7z x old_port.zip super.img -aoa 2>/dev/null || true
            if [ -f super.img ]; then
              simg2img super.img super_raw.img && rm super.img
              lpunpack -p odm_a super_raw.img . && rm super_raw.img
              if [ -f odm_a.img ]; then
                mkdir -p odm_template
                fsck.erofs --extract=odm_template odm_a.img 2>&1 | tail -1
                rm -f odm_a.img
                echo "✅ ODM template extracted (old dev's pipa→dizi bridge)"
              fi
            fi
            rm -f old_port.zip
          fi
          
          echo "=== Phase 2: Build our ODM from stock HyperOS + template ==="
          ODM_DIR="${WORK_DIR}/hyperos/extracted/odm"
          TEMPLATE="${WORK_DIR}/odm_template"
          
          # Copy bridge binaries from template (these are generic ColorOS tools)
          if [ -d "${TEMPLATE}" ]; then
            # resetprop — Magisk tool for runtime prop override (essential)
            [ -f "${TEMPLATE}/bin/resetprop" ] && {
              mkdir -p "${ODM_DIR}/bin"
              cp -v "${TEMPLATE}/bin/resetprop" "${ODM_DIR}/bin/"
              chmod 755 "${ODM_DIR}/bin/resetprop"
            }
            
            # oplus_performance.sh — dalvik heap tuning for ColorOS
            [ -f "${TEMPLATE}/bin/oplus_performance.sh" ] && {
              cp -v "${TEMPLATE}/bin/oplus_performance.sh" "${ODM_DIR}/bin/"
              chmod 755 "${ODM_DIR}/bin/oplus_performance.sh"
            }
            
            # Copy oplus HAL libraries (ColorOS system needs these stubs)
            # These are the same across different ColorOS ports — they're framework stubs
            for libdir in lib lib64; do
              if [ -d "${TEMPLATE}/${libdir}" ]; then
                mkdir -p "${ODM_DIR}/${libdir}"
                cp -rn "${TEMPLATE}/${libdir}/"*.so "${ODM_DIR}/${libdir}/" 2>/dev/null || true
                [ -d "${TEMPLATE}/${libdir}/soundfx" ] && cp -rn "${TEMPLATE}/${libdir}/soundfx" "${ODM_DIR}/${libdir}/"
                echo "✅ Copied ${libdir} HAL stubs: $(ls ${ODM_DIR}/${libdir}/*.so 2>/dev/null | wc -l) libraries"
              fi
            done
            
            # Copy init scripts (disable_ims etc.)
            if [ -d "${TEMPLATE}/etc/init" ]; then
              mkdir -p "${ODM_DIR}/etc/init"
              cp -rn "${TEMPLATE}/etc/init/"* "${ODM_DIR}/etc/init/" 2>/dev/null || true
              echo "✅ Copied init scripts"
            fi
            
            # Copy selinux precompiled policy if exists
            if [ -d "${TEMPLATE}/etc/selinux" ]; then
              mkdir -p "${ODM_DIR}/etc/selinux"
              cp -rn "${TEMPLATE}/etc/selinux/"* "${ODM_DIR}/etc/selinux/" 2>/dev/null || true
              echo "✅ Copied precompiled SELinux policy"
            fi
            
            # Copy vintf manifest fragments
            if [ -d "${TEMPLATE}/etc/vintf" ]; then
              mkdir -p "${ODM_DIR}/etc/vintf"
              cp -rn "${TEMPLATE}/etc/vintf/"* "${ODM_DIR}/etc/vintf/" 2>/dev/null || true
            fi
            
            # Copy devices_config
            if [ -d "${TEMPLATE}/etc/devices_config" ]; then
              mkdir -p "${ODM_DIR}/etc/devices_config"
              cp -rn "${TEMPLATE}/etc/devices_config/"* "${ODM_DIR}/etc/devices_config/" 2>/dev/null || true
            fi
            
            # Copy camera config
            if [ -d "${TEMPLATE}/etc/camera" ]; then
              mkdir -p "${ODM_DIR}/etc/camera"
              cp -rn "${TEMPLATE}/etc/camera/"* "${ODM_DIR}/etc/camera/" 2>/dev/null || true
            fi
            
            rm -rf "${TEMPLATE}"
          fi
          
          echo "=== Phase 3: Write ODM build.prop for OnePlus 12R → Poco Pad 5G ==="
          # The old dev's ODM had pipa/SM8250/Xiaomi Pad 6 props.
          # We REPLACE everything with our OnePlus 12R → ruan (Poco Pad 5G) identity.
          
          mkdir -p "${ODM_DIR}/etc"
          
          # Root-level build.prop just imports the etc one
          cat > "${ODM_DIR}/build.prop" << 'ROOTPROP'
          import /odm/etc/build.prop
          ROOTPROP
          sed -i 's/^          //' "${ODM_DIR}/build.prop"
          
          # The real ODM build.prop with ALL device identity for our port
          cat > "${ODM_DIR}/etc/build.prop" << ODMPROP
          ro.odm.product.cpu.abilist=arm64-v8a,armeabi-v7a,armeabi
          ro.odm.product.cpu.abilist32=armeabi-v7a,armeabi
          ro.odm.product.cpu.abilist64=arm64-v8a
          # begin common build properties
          ro.odm.build.date=$(date -u)
          ro.odm.build.date.utc=$(date +%s)
          ro.odm.build.fingerprint=Redmi/${DEVICE_CODENAME}/${DEVICE_CODENAME}:12/SKQ1.231214.001/V816.0.6.0.UNSCNXM:user/release-keys
          ro.odm.build.id=SKQ1.231214.001
          ro.odm.build.tags=release-keys
          ro.odm.build.type=user
          ro.odm.build.version.release=12
          ro.odm.build.version.sdk=32
          ro.product.odm.brand=${DONOR_BRAND}
          ro.product.odm.device=${DEVICE_CODENAME}
          ro.product.odm.manufacturer=${DONOR_BRAND}
          ro.product.odm.model=CPH2585
          ro.product.odm.name=${DEVICE_CODENAME}
          ro.product.odm.marketname=${DEVICE_NAME}
          ro.product.odm.cert=CPH2585
          # end common build properties
          #
          # ADDITIONAL ODM BUILD PROPERTIES — OnePlus 12R → Poco Pad 5G port
          #
          ro.build.device_family=OP${CPU_MODEL}
          qemu.hw.mainkeys=0
          ro.product.oplus.cpuinfo=${CPU_MODEL}
          ro.build.kernel.id=5.10.246
          oplus.dex.tempcontrol=true
          ro.zygote=zygote64
          persist.sys.oplus.storage.otg_optimize=true
          ro.vendor.qti.va_odm.support=1
          ro.com.android.dataroaming=false
          ro.vendor.config.oplus.uniform_single_sim=2
          ro.separate.soft=CPH2585
          ro.rom.featrue=allnet
          ro.vendor.product.oem=CPH2585
          ro.vendor.product.device.oem=CPH2585
          ro.vendor.oplus.market.name=${DEVICE_NAME}
          ro.sys.reserve.integrate=true
          ro.product.manufacturer=${DONOR_BRAND}
          ro.product.brand=${DONOR_BRAND}
          ro.build.display.id=CPH2585_16.0_ColorOS_Port
          ro.build.display.full_id=CPH2585_16.0_ColorOS_Port_$(date +%y%m%d)
          ro.build.version.oplusrom=V16.0
          ro.vendor.audio.policy.engine.odm=true
          vendor.display.force_tonemapping=1
          ro.oplus.display.screenSizeInches.primary=${SCREEN_SIZE}
          ro.surface_flinger.primary_display_orientation=ORIENTATION_0
          debug.sf.ignore_hwc_physical_display_orientation=true
          ro.vendor.oplus.camera.frontCamSize=${FRONT_CAM}MP
          ro.vendor.oplus.camera.backCamSize=${BACK_CAM}MP
          ro.config.ringtone=OnePlus_new_feeling.ogg
          ro.config.notification_sound=Whoop_doop.ogg
          ro.config.alarm_alert=Cloudscape.ogg
          # ColorOS my_* import chain
          import /my_bigball/build.prop
          import /my_carrier/build.prop
          import /my_engineering/build.prop
          import /my_heytap/build.prop
          import /my_manifest/build.prop
          import /my_product/build.prop
          import /my_region/build.prop
          import /my_stock/build.prop
          # UI effects
          ro.surface_flinger.supports_background_blur=1
          persist.sys.oplus.anim_level=1
          persist.sys.oplus.material_blur_switch=true
          ODMPROP
          sed -i 's/^          //' "${ODM_DIR}/etc/build.prop"
          
          echo "✅ ODM build.prop written for ${DONOR_BRAND} ${DONOR_MODEL} → ${DEVICE_NAME} (${DEVICE_CODENAME})"
          echo "=== ODM contents ==="
          find "${ODM_DIR}" -type f | head -30
          echo "=== ODM identity props ==="
          grep -E "brand|model|market|device_family|cpuinfo|display|camera" "${ODM_DIR}/etc/build.prop"

      - name: "COS&OOS: Vendor port"
        run: |
          HV="${WORK_DIR}/hyperos/extracted/vendor"
          CV="${WORK_DIR}/coloros/extracted/vendor"
          
          # Copy ColorOS user/group database into HyperOS vendor
          # (ColorOS system UIDs/GIDs must match vendor expectations)
          cp -v "${CV}/etc/group" "${HV}/etc/group"
          cp -v "${CV}/etc/passwd" "${HV}/etc/passwd"
          echo "✅ Vendor user/group database updated for ColorOS compatibility"

      - name: "bbk Step 7: Clean system my_*"
        run: |
          S="${WORK_DIR}/coloros/extracted/system"
          for d in my_product my_manifest my_region my_heytap my_bigball my_carrier my_engineering my_stock; do
            [ -d "${S}/${d}" ] && rm -rf "${S}/${d}" && echo "Deleted ${d}"
          done

      - name: "bbk Step 8: Add my_* to system"
        run: |
          S="${WORK_DIR}/coloros/extracted/system"
          for d in my_product my_manifest my_region my_heytap my_bigball my_carrier my_engineering my_stock; do
            if [ -d "${WORK_DIR}/coloros/extracted/${d}" ]; then
              cp -a "${WORK_DIR}/coloros/extracted/${d}" "${S}/"
              echo "Added ${d}"
            fi
          done

      - name: "bbk Step 9: Modify my_manifest (OnePlus 12R → Poco Pad 5G)"
        run: |
          # my_manifest defines the device identity that ColorOS sees at runtime.
          # The stock ColorOS ROM has OnePlus 12R identity here.
          # We must update it for our target: Poco Pad 5G (ruan).
          
          # Check both possible locations (root of system partition or inside system/)
          M=""
          for try in "${WORK_DIR}/coloros/extracted/system/my_manifest/build.prop" \
                     "${WORK_DIR}/coloros/extracted/system/my_manifest/etc/build.prop" \
                     "${WORK_DIR}/coloros/extracted/my_manifest/build.prop"; do
            [ -f "$try" ] && M="$try" && break
          done
          
          if [ -n "${M}" ]; then
            echo "Found my_manifest at: ${M}"
            sed -i '/first.api/d' "${M}"
            
            # Update market name to our target device
            if grep -q "market.name" "${M}"; then
              sed -i "s|.*market.name.*|ro.vendor.oplus.market.name=${DEVICE_NAME}|" "${M}"
            else
              echo "ro.vendor.oplus.market.name=${DEVICE_NAME}" >> "${M}"
            fi
            
            # Update en market name too
            if grep -q "market.enname" "${M}"; then
              sed -i "s|.*market.enname.*|ro.vendor.oplus.market.enname=${DEVICE_NAME}|" "${M}"
            fi
            
            # Update device/model references from OnePlus 12R to our target
            # (but keep the format — just change the values)
            if grep -q "ro.product.device=" "${M}"; then
              sed -i "s|ro.product.device=.*|ro.product.device=${DEVICE_CODENAME}|" "${M}"
            fi
            if grep -q "ro.product.model=" "${M}"; then
              sed -i "s|ro.product.model=.*|ro.product.model=CPH2585|" "${M}"
            fi
            
            echo "✅ my_manifest updated for ${DEVICE_NAME}"
            cat "${M}"
          else
            echo "⚠️ my_manifest build.prop not found"
          fi

      - name: "bbk Step 10: Add apex"
        run: |
          SE="${WORK_DIR}/coloros/extracted/system_ext"
          mkdir -p "${SE}/apex"
          if [ -f "${{ github.workspace }}/system_ext.zip" ]; then
            cd /tmp && unzip -o "${{ github.workspace }}/system_ext.zip" -d apex-tmp
            find /tmp/apex-tmp -name "*.apex" -exec cp -v {} "${SE}/apex/" \;
            ls -lh "${SE}/apex/"
            rm -rf /tmp/apex-tmp
          fi

      - name: "bbk Step 11: Add overlays"
        run: |
          MP="${WORK_DIR}/coloros/extracted/system/my_product"
          mkdir -p "${MP}/overlay"
          if [ -f "${{ github.workspace }}/overlay.zip" ]; then
            cd /tmp && unzip -o "${{ github.workspace }}/overlay.zip" -d overlay-tmp
            find /tmp/overlay-tmp -name "*.apk" -exec cp -v {} "${MP}/overlay/" \;
            ls -lh "${MP}/overlay/"
            rm -rf /tmp/overlay-tmp
          fi

      - name: "bbk Steps 12-15: Modify my_product (OnePlus 12R → Poco Pad 5G)"
        run: |
          # Check both possible locations
          PP=""
          for try in "${WORK_DIR}/coloros/extracted/system/my_product/build.prop" \
                     "${WORK_DIR}/coloros/extracted/system/my_product/etc/build.prop" \
                     "${WORK_DIR}/coloros/extracted/my_product/build.prop"; do
            [ -f "$try" ] && PP="$try" && break
          done
          
          if [ -n "${PP}" ]; then
            echo "Found my_product at: ${PP}"
            # Update version display — ColorOS 16 from OnePlus 12R
            grep -q "oplusrom.display" "${PP}" && sed -i "s#.*oplusrom.display.*#ro.oplusrom.display=16.0 | by ${DEVICE_NAME}#" "${PP}"
            # Remove phone-specific screen hole/notch props (we're a tablet)
            sed -i '/screenhole/d' "${PP}"
            # Set tablet DPI (12.1" WQXGA tablet needs appropriate density)
            grep -q "lcd.density" "${PP}" && sed -i "s|lcd.density=.*|lcd.density=440|" "${PP}"
            # Remove phone resolution scaling props (don't apply to tablet)
            for L in "ro.density.screenzoom.fdh" "ro.density.screenzoom.qdh" "ro.oplus.density.fhd_default" "ro.oplus.density.qhd_default" "ro.oplus.resolution.low" "ro.oplus.resolution.high"; do
              sed -i "/${L}/d" "${PP}"
            done
            # Mark as tablet device type
            grep -q "vpp.device.type" "${PP}" || echo "ro.oplus.vpp.device.type=pad" >> "${PP}"
            echo "✅ my_product updated for tablet"
            cat "${PP}"
          else
            echo "⚠️ my_product build.prop not found"
          fi

      - name: "bbk Step 14: Add imports"
        run: |
          SP="${WORK_DIR}/coloros/extracted/system/build.prop"
          if [ -f "${SP}" ]; then
            printf '\nimport /my_bigball/build.prop\nimport /my_carrier/build.prop\nimport /my_engineering/build.prop\nimport /my_heytap/build.prop\nimport /my_manifest/build.prop\nimport /my_product/build.prop\nimport /my_region/build.prop\nimport /my_stock/build.prop\n' >> "${SP}"
            echo "Imports added"
          fi

      - name: "🧹 Minor Debloat (Safe Mode)"
        run: |
          S="${WORK_DIR}/coloros/extracted/system"
          echo "=== BEFORE safe debloat ==="
          du -sh "${S}"
          cd "${S}"

          # Only remove completely useless dummy folders to keep it clean.
          # We are KEEPING all default Google apps, OEM apps, and OnePlus/ColorOS features.
          
          # Remove massive dummy bootanimations if they exist (usually 1440p 120fps ~ 150MB overhead)
          # find . -name "bootanimation.zip" -size +20M -delete 2>/dev/null || true

          # Calculate expected EROFS size (rough: 55% compression ratio)
          RAW_BYTES=$(du -sb "${S}" | cut -f1)
          EST_IMG=$((RAW_BYTES * 55 / 100))
          echo "=== AFTER safe debloat ==="
          du -sh "${S}"
          echo "Raw: $((RAW_BYTES / 1024 / 1024)) MiB, Estimated compressed system: $((EST_IMG / 1024 / 1024)) MiB"
          echo "Super total limit: $((DYNAMIC_SIZE / 1024 / 1024)) MiB"

      - name: Repack system.img
        run: |
          mkfs.erofs -zlz4 -b 4096 ${WORK_DIR}/output/system.img "${WORK_DIR}/coloros/extracted/system"
          ls -lh ${WORK_DIR}/output/system.img
          rm -rf "${WORK_DIR}/coloros/extracted/system"

      - name: Repack system_ext.img
        run: |
          mkfs.erofs -zlz4 -b 4096 ${WORK_DIR}/output/system_ext.img "${WORK_DIR}/coloros/extracted/system_ext"
          ls -lh ${WORK_DIR}/output/system_ext.img
          rm -rf "${WORK_DIR}/coloros/extracted/system_ext"

      - name: Repack product.img
        run: |
          mkfs.erofs -zlz4 -b 4096 ${WORK_DIR}/output/product.img "${WORK_DIR}/coloros/extracted/product"
          ls -lh ${WORK_DIR}/output/product.img
          rm -rf "${WORK_DIR}/coloros/extracted/product"

      - name: Repack vendor.img
        run: |
          mkfs.erofs -zlz4 -b 4096 ${WORK_DIR}/output/vendor.img "${WORK_DIR}/hyperos/extracted/vendor"
          ls -lh ${WORK_DIR}/output/vendor.img
          rm -rf "${WORK_DIR}/hyperos/extracted/vendor"

      - name: Repack odm.img
        run: |
          [ -d "${WORK_DIR}/hyperos/extracted/odm" ] && mkfs.erofs -zlz4 -b 4096 ${WORK_DIR}/output/odm.img "${WORK_DIR}/hyperos/extracted/odm" && ls -lh ${WORK_DIR}/output/odm.img

      - name: 🛠️ Patch vendor_boot (SELinux permissive)
        run: |
          cd ${WORK_DIR}/hyperos/images
          if [ -f vendor_boot.img ]; then
            wget -q https://github.com/chenxiaolong/systemd-bootchart/raw/master/src/magiskboot 2>/dev/null || wget -q https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
            if [ -f Magisk-v26.1.apk ]; then
              unzip -p Magisk-v26.1.apk lib/x86_64/libmagiskboot.so > magiskboot
            fi
            chmod +x magiskboot
            ./magiskboot unpack vendor_boot.img
            if [ -f header ]; then
              sed -i 's/$/ androidboot.selinux=permissive/' header
              ./magiskboot repack vendor_boot.img vendor_boot_patched.img
              mv vendor_boot_patched.img vendor_boot.img
              echo "✅ vendor_boot patched with permissive SELinux"
            else
              echo "⚠️ Could not unpack vendor_boot!"
            fi
            rm -f magiskboot kernel ramdisk header
          fi

      - name: Copy HyperOS boot images
        run: |
          for img in boot.img vendor_boot.img vendor_dlkm.img modem.img vbmeta.img vbmeta_system.img dtbo.img; do
            [ -f "${WORK_DIR}/hyperos/images/${img}" ] && cp -v "${WORK_DIR}/hyperos/images/${img}" ${WORK_DIR}/output/
          done
          echo "=== ALL OUTPUT ==="
          ls -lh ${WORK_DIR}/output/

      - name: "🗄️ Generate metadata.img & userdata.img"
        run: |
          sudo apt-get update > /dev/null 2>&1 || true
          sudo apt-get install -y f2fs-tools e2fsprogs > /dev/null 2>&1 || true
          cd ${WORK_DIR}/output

          # metadata.img — ext4, stores FBE encryption keys
          # Stock ruan metadata partition is 16MB
          echo "Creating metadata.img (16 MiB, ext4)..."
          dd if=/dev/zero of=metadata.img bs=1M count=16
          mke2fs -t ext4 -L metadata -b 4096 -m 0 metadata.img
          echo "✅ metadata.img: $(ls -lh metadata.img | awk '{print $5}')"

          # userdata.img — f2fs, formatted with encryption + quota features
          # Stock ruan userdata uses f2fs with FBE. ~500MB gives proper f2fs
          # structure (superblock, segment info, node/data areas) that the
          # bootloader expands to fill the full partition on first boot.
          echo "Creating userdata.img (500 MiB, f2fs)..."
          dd if=/dev/zero of=userdata.img bs=1M count=500
          
          F2FS_CMD=""
          if command -v mkfs.f2fs > /dev/null 2>&1; then
            F2FS_CMD="mkfs.f2fs"
          elif command -v make_f2fs > /dev/null 2>&1; then
            F2FS_CMD="make_f2fs"
          elif [ -f /sbin/mkfs.f2fs ]; then
            F2FS_CMD="/sbin/mkfs.f2fs"
          fi

          if [ -n "$F2FS_CMD" ]; then
            echo "Formatting with $F2FS_CMD..."
            $F2FS_CMD -l data \
              -O encrypt,extra_attr,inode_checksum,sb_checksum,quota,project_quota,casefold,compression \
              -f userdata.img || $F2FS_CMD -l data -f userdata.img
          else
            echo "⚠️ mkfs.f2fs not found, falling back to ext4..."
            mke2fs -t ext4 -L data -b 4096 -m 0 userdata.img
          fi

          echo "✅ userdata.img: $(ls -lh userdata.img | awk '{print $5}')"

          echo "=== All output images ==="
          ls -lh ${WORK_DIR}/output/

      - name: "🔧 Build super.img with lpmake"
        run: |
          cd ${WORK_DIR}/output
          echo "=== Partition images ==="
          ls -lh system.img vendor.img odm.img vendor_dlkm.img 2>/dev/null || true

          SYS_SIZE=$(stat -c '%s' system.img)
          VND_SIZE=$(stat -c '%s' vendor.img)
          ODM_SIZE=$(stat -c '%s' odm.img 2>/dev/null || echo 0)
          VDLKM_SIZE=$(stat -c '%s' vendor_dlkm.img 2>/dev/null || echo 0)

          # Align to 4096 boundary
          align() { echo $(( ($1 + 4095) / 4096 * 4096 )); }
          SYS_SIZE=$(align $SYS_SIZE)
          VND_SIZE=$(align $VND_SIZE)
          ODM_SIZE=$(align $ODM_SIZE)
          VDLKM_SIZE=$(align $VDLKM_SIZE)

                    SYS_EXT_SIZE=$(stat -c '%s' system_ext.img 2>/dev/null || echo 0)
          PROD_SIZE=$(stat -c '%s' product.img 2>/dev/null || echo 0)
          SYS_EXT_SIZE=$(align $SYS_EXT_SIZE)
          PROD_SIZE=$(align $PROD_SIZE)
          TOTAL=$((SYS_SIZE + VND_SIZE + ODM_SIZE + VDLKM_SIZE + SYS_EXT_SIZE + PROD_SIZE))
          echo "Total partition data: $((TOTAL / 1024 / 1024)) MiB"
          echo "Dynamic limit: $((DYNAMIC_SIZE / 1024 / 1024)) MiB (${DYNAMIC_SIZE})"
          echo "Super size: $((SUPER_SIZE / 1024 / 1024)) MiB (${SUPER_SIZE})"

          if [ "$TOTAL" -gt "$DYNAMIC_SIZE" ]; then
            echo "::error::Total ($TOTAL) exceeds dynamic partition limit ($DYNAMIC_SIZE)!"
            echo "::error::Need to debloat $((( TOTAL - DYNAMIC_SIZE ) / 1024 / 1024)) MiB more"
            exit 1
          fi

          GROUP_SIZE=$TOTAL

          # Build lpmake command
          LPMAKE_CMD="lpmake"
          LPMAKE_CMD="${LPMAKE_CMD} --metadata-size 65536"
          LPMAKE_CMD="${LPMAKE_CMD} --metadata-slots 3"
          LPMAKE_CMD="${LPMAKE_CMD} --device super:${SUPER_SIZE}"
          LPMAKE_CMD="${LPMAKE_CMD} --group qti_dynamic_partitions_a:${GROUP_SIZE}"
          LPMAKE_CMD="${LPMAKE_CMD} --partition system_a:readonly:${SYS_SIZE}:qti_dynamic_partitions_a --image system_a=system.img"
          LPMAKE_CMD="${LPMAKE_CMD} --partition vendor_a:readonly:${VND_SIZE}:qti_dynamic_partitions_a --image vendor_a=vendor.img"

          if [ -f odm.img ] && [ "$ODM_SIZE" -gt 0 ]; then
            LPMAKE_CMD="${LPMAKE_CMD} --partition odm_a:readonly:${ODM_SIZE}:qti_dynamic_partitions_a --image odm_a=odm.img"
          fi

          if [ -f vendor_dlkm.img ] && [ "$VDLKM_SIZE" -gt 0 ]; then
            LPMAKE_CMD="${LPMAKE_CMD} --partition vendor_dlkm_a:readonly:${VDLKM_SIZE}:qti_dynamic_partitions_a --image vendor_dlkm_a=vendor_dlkm.img"
          fi

          if [ -f system_ext.img ] && [ "$SYS_EXT_SIZE" -gt 0 ]; then
            LPMAKE_CMD="${LPMAKE_CMD} --partition system_ext_a:readonly:${SYS_EXT_SIZE}:qti_dynamic_partitions_a --image system_ext_a=system_ext.img"
          fi

          if [ -f product.img ] && [ "$PROD_SIZE" -gt 0 ]; then
            LPMAKE_CMD="${LPMAKE_CMD} --partition product_a:readonly:${PROD_SIZE}:qti_dynamic_partitions_a --image product_a=product.img"
          fi

          LPMAKE_CMD="${LPMAKE_CMD} --sparse --output super.img"

          echo "=== Running lpmake ==="
          echo "$LPMAKE_CMD"
          $LPMAKE_CMD

          ls -lh super.img
          echo "SUPER_IMG=super.img" >> $GITHUB_ENV

      - name: "📦 Build fastboot flashable package"
        run: |
          FD="${WORK_DIR}/fastboot-pkg"
          mkdir -p "${FD}/images"
          cd ${WORK_DIR}/output

          # Copy super.img
          cp -v super.img "${FD}/images/"

          # Copy boot-related images
          for img in boot.img vendor_boot.img vbmeta.img vbmeta_system.img dtbo.img modem.img metadata.img userdata.img; do
            [ -f "$img" ] && cp -v "$img" "${FD}/images/"
          done

          # Create flash script for Linux/Mac
          cat > "${FD}/flash_all.sh" << 'FLASHEOF'
          #!/bin/bash
          set -e
          echo "============================================"
          echo "  ColorOS Port for Poco Pad 5G (ruan)"
          echo "  Fastboot Flashable ROM"
          echo "============================================"
          echo ""
          echo "WARNING: This will ERASE all data!"
          echo "Make sure bootloader is unlocked."
          echo ""
          read -p "Press ENTER to continue or Ctrl+C to cancel..."

          CD="$(cd "$(dirname "$0")" && pwd)"
          IMG="${CD}/images"

          echo "[1/7] Flashing super.img (contains system+vendor+odm)..."
          fastboot flash super "${IMG}/super.img"

          echo "[2/7] Flashing crypto/data (metadata+userdata)..."
          [ -f "${IMG}/metadata.img" ] && fastboot flash metadata "${IMG}/metadata.img"
          [ -f "${IMG}/userdata.img" ] && fastboot flash userdata "${IMG}/userdata.img"
          fastboot -w

          echo "[3/7] Flashing boot..."
          fastboot flash boot "${IMG}/boot.img"

          echo "[4/7] Flashing vendor_boot..."
          fastboot flash vendor_boot "${IMG}/vendor_boot.img"

          echo "[5/7] Disabling AVB verification..."
          fastboot flash vbmeta "${IMG}/vbmeta.img" --disable-verity --disable-verification 2>/dev/null || \
            fastboot flash vbmeta "${IMG}/vbmeta.img"
          [ -f "${IMG}/vbmeta_system.img" ] && fastboot flash vbmeta_system "${IMG}/vbmeta_system.img"

          echo "[6/7] Flashing dtbo..."
          [ -f "${IMG}/dtbo.img" ] && fastboot flash dtbo "${IMG}/dtbo.img"

          echo "[7/7] Flashing modem..."
          [ -f "${IMG}/modem.img" ] && fastboot flash modem "${IMG}/modem.img"

          echo ""
          echo "============================================"
          echo "  Flash complete! Rebooting..."
          echo "============================================"
          fastboot reboot
          FLASHEOF
          chmod +x "${FD}/flash_all.sh"

          # Create flash script for Windows
          cat > "${FD}/flash_all.bat" << 'BATEOF'
          @echo off
          echo ============================================
          echo   ColorOS Port for Poco Pad 5G (ruan)
          echo   Fastboot Flashable ROM
          echo ============================================
          echo.
          echo WARNING: This will ERASE all data!
          pause

          echo [1/7] Flashing super.img...
          fastboot flash super images\super.img

          echo [2/7] Flashing crypto/data...
          if exist images\metadata.img fastboot flash metadata images\metadata.img
          if exist images\userdata.img fastboot flash userdata images\userdata.img
          fastboot -w

          echo [3/7] Flashing boot...
          fastboot flash boot images\boot.img

          echo [4/7] Flashing vendor_boot...
          fastboot flash vendor_boot images\vendor_boot.img

          echo [5/7] Disabling AVB...
          fastboot flash vbmeta images\vbmeta.img --disable-verity --disable-verification
          if exist images\vbmeta_system.img fastboot flash vbmeta_system images\vbmeta_system.img

          echo [6/7] Flashing dtbo...
          if exist images\dtbo.img fastboot flash dtbo images\dtbo.img

          echo [7/7] Flashing modem...
          if exist images\modem.img fastboot flash modem images\modem.img

          echo.
          echo ============================================
          echo   Flash complete! Rebooting...
          echo ============================================
          fastboot reboot
          pause
          BATEOF

          # Create manual fastbootd instruction for individual flashing
          cat > "${FD}/MANUAL_FLASH_GUIDE.txt" << 'GUIDEEOF'
          ===== MANUAL FLASH GUIDE (Individual Partitions) =====

          If super.img flash fails, use fastbootd mode instead.
          Note: Individual partition images (system/vendor/odm) are NOT included 
          in this ZIP to save space. To flash them manually, you must extract 
          them from super.img using lpunpack.
          GUIDEEOF

          # Build the ZIP
          cd "${FD}"
          FASTBOOT_ZIP="ColorOS_Fastboot_${DEVICE_CODENAME}_$(date +%Y%m%d).zip"
          zip -r1 "${WORK_DIR}/output/${FASTBOOT_ZIP}" .
          echo "FASTBOOT_ZIP=${FASTBOOT_ZIP}" >> $GITHUB_ENV
          echo "Fastboot ZIP built: ${FASTBOOT_ZIP}"
          ls -lh "${WORK_DIR}/output/${FASTBOOT_ZIP}"

      - name: 🗜️ Validate ZIP integrity
        run: |
          set -Eeuo pipefail
          ZF="${WORK_DIR}/output/${FASTBOOT_ZIP}"
          if [ ! -f "$ZF" ]; then
            echo "::error::Fastboot ZIP not found: ${FASTBOOT_ZIP}"
            exit 1
          fi

          python3 -m zipfile -t "$ZF" >/dev/null || {
            echo "::error::ZIP integrity check failed: ${FASTBOOT_ZIP}"
            exit 1
          }
          echo "✅ ZIP integrity verified"

          final_size_bytes="$(stat -c '%s' "$ZF")"
          final_size_human="$(python3 - "$final_size_bytes" <<'PY'
          import sys
          size = int(sys.argv[1])
          value = float(size)
          for unit in ("B", "KiB", "MiB", "GiB", "TiB"):
              if value < 1024 or unit == "TiB":
                  print(f"{size} B" if unit == "B" else f"{value:.2f} {unit}")
                  break
              value /= 1024
          PY
          )"
          echo "📦 Fastboot ZIP: ${FASTBOOT_ZIP} (${final_size_human})"
          echo "FASTBOOT_ZIP_SIZE=${final_size_human}" >> $GITHUB_ENV

      - name: ☁️ Upload to Google Drive (optional)
        id: gdrive_upload
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          [ -z "${GDRIVE_SA_KEY:-}" ] && { echo "::warning::GDRIVE_SA_KEY not set, skipping"; exit 0; }
          [ -z "${GDRIVE_FOLDER_ID:-}" ] && { echo "::warning::GDRIVE_FOLDER_ID not set, skipping"; exit 0; }
          
          # Install rclone (direct binary download)
          cd /tmp
          wget -q "https://downloads.rclone.org/current/rclone-current-linux-amd64.zip" -O rclone.zip
          unzip -q rclone.zip
          sudo cp rclone-*/rclone /usr/local/bin/
          sudo chmod 755 /usr/local/bin/rclone
          rm -rf rclone-*.zip rclone-*/
          export PATH="/usr/local/bin:$PATH"
          rclone version
          
          # Setup rclone config for service account
          mkdir -p ~/.config/rclone
          
          # Decode service account key (handle both base64 and raw JSON)
          if echo "${GDRIVE_SA_KEY}" | base64 -d > /tmp/sa_key.json 2>/dev/null; then
            echo "✅ SA key decoded from base64"
          else
            echo "${GDRIVE_SA_KEY}" > /tmp/sa_key.json
            echo "✅ SA key stored as raw JSON"
          fi
          
          # Verify the key file is valid JSON
          if ! python3 -c "import json; json.load(open('/tmp/sa_key.json'))" 2>/dev/null; then
            echo "::error::Invalid service account key format"
            echo "GDRIVE_STATUS=failed" >> $GITHUB_ENV
            exit 0
          fi
          
          # Create rclone config (use echo to avoid heredoc indentation issues)
          mkdir -p ~/.config/rclone
          echo "[gdrive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo "service_account_file = /tmp/sa_key.json" >> ~/.config/rclone/rclone.conf
          echo "root_folder_id = ${GDRIVE_FOLDER_ID}" >> ~/.config/rclone/rclone.conf
          
          RCLONE_CONF="$HOME/.config/rclone/rclone.conf"
          UPLOAD_DIR="ColorOS_Ruan_$(date +%Y%m%d)"
          ZF="${WORK_DIR}/output/${FASTBOOT_ZIP}"
          
          echo "Uploading ${FASTBOOT_ZIP} to Google Drive..."
          echo "Folder ID: ${GDRIVE_FOLDER_ID}"
          
          # Test connection first
          echo "Testing rclone connection..."
          rclone lsd "gdrive:" --config "$RCLONE_CONF" --max-depth 0 2>&1 || {
            echo "::warning::Cannot access Google Drive root - trying direct folder access..."
            # Try listing the specific folder directly
            rclone lsd "gdrive:${UPLOAD_DIR}/" --config "$RCLONE_CONF" 2>&1 || {
              echo "::error::Google Drive authentication failed. Check:"
              echo "1. GDRIVE_SA_KEY is a valid service account JSON key"
              echo "2. Google Drive API is enabled in Google Cloud Console"
              echo "3. Service account has been shared on the target folder"
              echo "GDRIVE_STATUS=failed" >> $GITHUB_ENV
              exit 0
            }
          }
          
          # Create remote folder
          rclone mkdir "gdrive:${UPLOAD_DIR}" --config "$RCLONE_CONF" 2>/dev/null || true
          
            # Upload with progress
            echo "Starting upload..."
            set +e
            rclone copy "$ZF" "gdrive:${UPLOAD_DIR}/" --config "$RCLONE_CONF" --progress --stats 30s 2>&1
            cp_status=$?
            if [ $cp_status -eq 0 ]; then
              rclone link "gdrive:${UPLOAD_DIR}/${FASTBOOT_ZIP}" --config "$RCLONE_CONF" 2>/dev/null | tail -n1 | tr -d '\r' > /tmp/drive_url || true
              drive_url=$(cat /tmp/drive_url || echo "")
              if [ -n "$drive_url" ] && [[ "$drive_url" == http* ]]; then
                echo "✅ Google Drive: ${drive_url}"
                echo "GDRIVE_URL=${drive_url}" >> $GITHUB_ENV
              else
                echo "✅ Google Drive: https://drive.google.com/drive/folders/${GDRIVE_FOLDER_ID}"
                echo "GDRIVE_URL=https://drive.google.com/drive/folders/${GDRIVE_FOLDER_ID}" >> $GITHUB_ENV
              fi
              echo "GDRIVE_STATUS=success" >> $GITHUB_ENV
            else
              echo "::warning::Google Drive upload failed (exit code $cp_status)"
              echo "GDRIVE_STATUS=failed" >> $GITHUB_ENV
            fi
            set -e

      - name: 🚀 Upload to Gofile
        if: always()
        id: gofile_upload
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ZF="${WORK_DIR}/output/${FASTBOOT_ZIP}"
          [ -f "$ZF" ] || { echo "::warning::ZIP not found, skipping Gofile"; exit 0; }
          [ -z "${GOFILE_TOKEN:-}" ] && { echo "::warning::GOFILE_TOKEN not set, skipping Gofile"; exit 0; }
          
          echo "Uploading ${FASTBOOT_ZIP} to Gofile (${FASTBOOT_ZIP_SIZE:-unknown})..."
          
          # Gofile API v3: POST https://upload.gofile.io/uploadfile
          # Auth via Authorization header
          set +e
          upload_response="$(curl -s --max-time 3600 --connect-timeout 30 \
            -H "Authorization: Bearer ${GOFILE_TOKEN}" \
            -F "file=@${ZF}" \
            "https://upload.gofile.io/uploadfile" 2>&1)"
          gf_status=$?
          set -e
          
          if [ $gf_status -eq 0 ]; then
            gf_url="$(echo "$upload_response" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if d.get('status')=='ok':
              print(d['data']['downloadPage'])
          else:
              print(d.get('status','error'))
              sys.exit(1)
          " 2>/dev/null)"
            if [ -n "$gf_url" ] && [[ "$gf_url" == http* ]]; then
              echo "✅ Gofile: ${gf_url}"
              echo "GOFILE_URL=${gf_url}" >> $GITHUB_ENV
            else
              echo "::warning::Gofile upload returned: ${gf_url:-no response}"
              echo "Gofile response: ${upload_response}"
              echo "GOFILE_STATUS=failed" >> $GITHUB_ENV
            fi
          else
            echo "::warning::Gofile upload failed (exit code ${gf_status})"
            echo "Gofile response: ${upload_response}"
            echo "GOFILE_STATUS=failed" >> $GITHUB_ENV
          fi
          echo "GOFILE_STATUS=${gf_status}" >> $GITHUB_ENV

      - name: ⬆️ Upload to SourceForge
        if: always()
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
        run: |
          set -Eeuo pipefail
          
          # Install sshpass
          sudo apt-get install -y sshpass > /dev/null 2>&1 || true
          
          UPLOAD_DIR="ColorOS_Ruan_$(date +%Y%m%d)"
          ZF="${WORK_DIR}/output/${FASTBOOT_ZIP}"
          [ -f "$ZF" ] || { echo "::warning::ZIP not found, skipping SourceForge"; exit 0; }
          
          echo "Uploading ${FASTBOOT_ZIP} to SourceForge (${FASTBOOT_ZIP_SIZE:-unknown})..."
          
          # Create remote directory first via ssh (not sftp to avoid 2GB limit)
          set +e
          sshpass -p "$SF_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "${SF_USERNAME}@frs.sourceforge.net" \
            "mkdir -p /home/frs/project/${SF_PROJECT}/${UPLOAD_DIR}" 2>/dev/null || true
          
          # Use scp with -l flag for large files, or use rsync
          # scp handles large files better than sftp which can stall at 2GB
          sshpass -p "$SF_PASSWORD" scp -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$ZF" \
            "${SF_USERNAME}@frs.sourceforge.net:/home/frs/project/${SF_PROJECT}/${UPLOAD_DIR}/${FASTBOOT_ZIP}"
          sf_status=$?
          set -e
          
          if [ $sf_status -eq 0 ]; then
            sf_url="https://sourceforge.net/projects/${SF_PROJECT}/files/${UPLOAD_DIR}/${FASTBOOT_ZIP}"
            echo "✅ SourceForge: ${sf_url}"
            echo "SF_URL=${sf_url}" >> $GITHUB_ENV
          else
            echo "::warning::SourceForge scp failed, trying sftp as fallback..."
            set +e
            printf 'mkdir /home/frs/project/%s/%s\ncd /home/frs/project/%s/%s\nput %s\nbye\n' \
              "${SF_PROJECT}" "${UPLOAD_DIR}" "${SF_PROJECT}" "${UPLOAD_DIR}" "${ZF}" | \
              sshpass -p "$SF_PASSWORD" sftp -o StrictHostKeyChecking=no \
                "${SF_USERNAME}@frs.sourceforge.net"
            sf_status=$?
            set -e
            if [ $sf_status -eq 0 ]; then
              sf_url="https://sourceforge.net/projects/${SF_PROJECT}/files/${UPLOAD_DIR}/${FASTBOOT_ZIP}"
              echo "✅ SourceForge (sftp): ${sf_url}"
              echo "SF_URL=${sf_url}" >> $GITHUB_ENV
            else
              echo "::warning::SourceForge upload failed"
            fi
          fi
          echo "SF_STATUS=${sf_status}" >> $GITHUB_ENV

      - name: 📊 Final Summary
        if: always()
        run: |
          set -Eeuo pipefail
          echo "============================================"
          echo "  FULL ROM PORTING COMPLETE!"
          echo "============================================"
          echo "  Device: ${DEVICE_NAME} (${DEVICE_CODENAME})"
          echo "  Donor: ${DONOR_BRAND} ${DONOR_MODEL}"
          echo ""
          echo "  Fastboot ZIP: ${FASTBOOT_ZIP}"
          echo "  ZIP Size: ${FASTBOOT_ZIP_SIZE:-unknown}"
          echo ""
          echo "  Download Links:"
          if [ -n "${GOFILE_URL:-}" ]; then
            echo "  🚀 Gofile: ${GOFILE_URL}"
          fi
          if [ -n "${SF_URL:-}" ]; then
            echo "  📁 SourceForge: ${SF_URL}"
          fi
          if [ -n "${GDRIVE_URL:-}" ]; then
            echo "  ☁️ Google Drive: ${GDRIVE_URL}"
          fi
          echo ""
          echo "  Flash from OrangeFox recovery"
          echo "  WARNING: FLASH AT YOUR OWN RISK!"
          echo "============================================"

      - name: 🧹 Cleanup workspace
        if: always()
        run: |
          sudo rm -rf ${WORK_DIR}/hyperos ${WORK_DIR}/coloros
          echo "✅ Cleanup complete"
